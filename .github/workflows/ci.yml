name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Code Quality (lint + format check)
  # ─────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linting tools
        run: pip install flake8 black

      - name: Run flake8 (style & syntax)
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=SwinIR/,LoRA/,.git/ \
            --extend-ignore=E203,W503 \
            --count --statistics

      - name: Check formatting with black
        run: |
          black --check --line-length=120 \
            --exclude='/(SwinIR|LoRA|\.git)/' \
            .

  # ─────────────────────────────────────────────
  # Job 2: Install deps & smoke-test imports
  # ─────────────────────────────────────────────
  smoke-test:
    name: Install & Import Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install system dependencies (ImageMagick for Wand)
        run: sudo apt-get update -q && sudo apt-get install -y libmagickwand-dev

      - name: Install CPU-only PyTorch (faster, no GPU needed in CI)
        run: |
          pip install torch==2.2.0 torchvision==0.17.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          pip install \
            numpy==1.26.4 \
            Pillow==10.4.0 \
            Wand==0.6.13 \
            matplotlib==3.9.2 \
            opencv-python==4.4.0.46 \
            tqdm==4.67.1 \
            timm==0.4.12 \
            ipython==7.19.0 \
            pandas==2.3.1 \
            pytest

      - name: Run import smoke tests
        run: python -m pytest tests/test_imports.py -v

  # ─────────────────────────────────────────────
  # Job 3: Unit tests
  # ─────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: smoke-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install system dependencies (ImageMagick for Wand)
        run: sudo apt-get update -q && sudo apt-get install -y libmagickwand-dev

      - name: Install CPU-only PyTorch
        run: |
          pip install torch==2.2.0 torchvision==0.17.0 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          pip install \
            numpy==1.26.4 \
            Pillow==10.4.0 \
            Wand==0.6.13 \
            matplotlib==3.9.2 \
            opencv-python==4.4.0.46 \
            tqdm==4.67.1 \
            timm==0.4.12 \
            ipython==7.19.0 \
            pandas==2.3.1 \
            pytest

      - name: Run all tests
        run: python -m pytest tests/ -v --tb=short
